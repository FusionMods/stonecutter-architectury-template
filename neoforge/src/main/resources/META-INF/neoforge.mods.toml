modLoader = "javafml"
loaderVersion = "[2,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

# Optional/soft dependency - see neoforge/build.gradle.kts.
[[dependencies.${mod_id}]]
modId = "cloth-config"
type = "optional"
ordering = "NONE"
side = "BOTH"
